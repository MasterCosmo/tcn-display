<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#122d54">
<title>TCN Display Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1B3F72;--navy-dark:#122d54;--orange:#F47B20;--orange-light:#ffa05e;--cream:#E8E4DC;
  --bg:#0f1923;--surface:#182234;--surface2:#1e2d44;--surface3:#243452;
  --border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);
  --text:#e8e4dc;--muted:#8a9ab5;--green:#4cdb7a;--red:#f05060;--r:12px;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.4;overflow:hidden}
button{font-family:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
/* top bar */
.top{background:var(--navy-dark);border-bottom:2px solid var(--orange);padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.top h1{font-family:'Oswald',sans-serif;font-size:1.05rem;letter-spacing:.06em;font-weight:600;color:var(--cream);line-height:1.1;flex:1;min-width:0}
.top h1 small{display:block;font-family:'Inter',sans-serif;font-size:.68rem;font-weight:500;letter-spacing:.14em;color:var(--orange);text-transform:uppercase;margin-top:2px}
.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:600;font-size:.95rem;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-pub{background:var(--orange);color:#fff;position:relative;letter-spacing:.03em}
.btn-pub:disabled{opacity:.45}
.btn-pub .dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--navy-dark);display:none}
.btn-pub.dirty .dot{display:block}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}
.btn-danger{background:transparent;border:1px solid rgba(240,80,96,.4);color:var(--red)}
.btn-block{width:100%}
/* main */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.view{display:none}.view.on{display:block}
.sect{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin:4px 2px 10px}
/* tab bar */
nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--sab);flex-shrink:0}
nav button{flex:1;background:none;border:none;padding:9px 2px 8px;color:var(--muted);font-size:.68rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:54px}
nav button .ic{font-size:1.25rem;line-height:1}
nav button.on{color:var(--orange)}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.slide-row{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 12px}
.slide-row .main{flex:1;min-width:0;cursor:pointer;padding:4px 0}
.badge{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface3);color:var(--orange-light);margin-bottom:3px}
.slide-row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:10px;border:none;background:var(--surface2);color:var(--text);font-size:1.05rem;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.ib:disabled{opacity:.25}
.ib.del{color:var(--red)}
.acts{display:flex;gap:6px;flex-shrink:0}
.addbar{position:sticky;bottom:0;padding-top:6px}
/* forms */
.fg{margin-bottom:14px}
label.fl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fh{font-size:.76rem;color:var(--muted);margin-top:5px}
input.fi,textarea.fi,select.fi{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:inherit;font-size:16px;padding:12px;min-height:46px;outline:none}
textarea.fi{resize:vertical;min-height:84px;line-height:1.4}
input.fi:focus,textarea.fi:focus{border-color:var(--orange)}
.chk{display:flex;align-items:center;gap:12px;padding:10px 2px;font-size:.95rem;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--orange);flex-shrink:0}
.cnt{float:right;font-weight:500;letter-spacing:0;text-transform:none}
.img-box{border:1.5px dashed var(--border2);border-radius:10px;padding:12px;text-align:center;background:var(--surface2)}
.img-box img{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:0 auto 10px;background:#000}
.img-box .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.img-box input[type=file]{display:none}
.rec{padding:10px;background:var(--surface2);border-radius:10px;margin-bottom:10px;border:1px solid var(--border)}
.rec .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rec .top2{display:flex;gap:8px}
.evrow{padding:12px}
.evrow .g{display:grid;grid-template-columns:78px 78px 1fr;gap:8px;margin-bottom:8px}
.evrow .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .top{border-bottom-color:var(--border2)}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(30px + var(--sab))}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + var(--sab));border-top:1px solid var(--border2)}
.modal h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.1rem;color:var(--cream);margin-bottom:6px}
.modal p{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:16px 8px;font-weight:600;font-size:.9rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px}
.types button .e{font-size:1.5rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* toast & status */
#toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translate(-50%,20px);background:var(--surface3);border:1px solid var(--border2);padding:11px 18px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{color:var(--red);border-color:rgba(240,80,96,.5)}
#toast.ok{color:var(--green)}
.center{text-align:center;padding:60px 20px;color:var(--muted)}
.center .big{font-size:2.4rem;margin-bottom:10px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:.82rem;color:var(--muted);line-height:1.5;margin-bottom:14px}
.note a{color:var(--orange-light)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>TCN Display<small>Mobile Manager</small></h1>
    <button class="btn btn-pub" id="btnPub" disabled>Publish<span class="dot"></span></button>
  </div>
  <main>
    <div class="view on" id="v-slides"></div>
    <div class="view" id="v-ticker"></div>
    <div class="view" id="v-events"></div>
    <div class="view" id="v-banners"></div>
    <div class="view" id="v-settings"></div>
  </main>
  <nav id="nav">
    <button data-v="slides" class="on"><span class="ic">🎬</span>Slides</button>
    <button data-v="ticker"><span class="ic">📰</span>Ticker</button>
    <button data-v="events"><span class="ic">📅</span>Events</button>
    <button data-v="banners"><span class="ic">💼</span>Banners</button>
    <button data-v="settings"><span class="ic">⚙️</span>Settings</button>
  </nav>
</div>

<div class="sheet" id="editor">
  <div class="top">
    <button class="btn btn-ghost" id="edBack">‹ Back</button>
    <h1 id="edTitle" style="text-align:center">Slide<small id="edSub"></small></h1>
    <button class="btn btn-danger" id="edDel">Delete</button>
  </div>
  <div class="body" id="edBody"></div>
</div>

<div class="modal" id="mAdd"><div class="box">
  <h3>Add a slide</h3><p>Pick a slide type.</p>
  <div class="types" id="typeGrid"></div>
  <button class="btn btn-ghost btn-block" style="margin-top:12px" id="mAddCancel">Cancel</button>
</div></div>

<div class="modal" id="mConfirm"><div class="box">
  <h3 id="cTitle">Are you sure?</h3><p id="cMsg"></p>
  <div class="two"><button class="btn btn-ghost" id="cNo">Cancel</button><button class="btn btn-danger" id="cYes" style="background:var(--red);color:#fff;border-color:var(--red)">Delete</button></div>
</div></div>

<div id="toast"></div>

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildDisplayForPublish(payload, css, logoSrc) {
  const sl = payload.slides, ev = payload.events, ba = payload.bannerAds, st = payload.settings;
  const hdrMsg = st.headerMsg ? '<div class="topbar-divider"></div><div class="header-msg-display">' + st.headerMsg + '</div>' : '';

  function sToHTMLp(s) {
    function withImgP(baseClass, innerContent) {
      if (s.bgImage) {
        return '<div class="slide ' + baseClass + ' slide-has-img"><div class="slide-text-block">' + innerContent + '</div><div class="slide-img-block"><img class="slide-bg-img" src="' + s.bgImage + '"></div></div>';
      }
      return '<div class="slide ' + baseClass + '">' + innerContent + '</div>';
    }
    if (s.type === 'news') {
      const hl = (s.headline || '').split('\n').map(l => (s.accentWord && l.trim().toUpperCase() === (s.accentWord || '').toUpperCase()) ? '<em>' + l + '</em>' : l).join('<br>');
      const body = s.body ? '<p class="news-body">' + s.body.replace(/\n/g,'<br>') + '</p>' : '';
      const chip = s.chip ? '<div class="news-chip">' + s.chip + '</div>' : '';
      if (s.bgImage) {
        return '<div class="slide slide-news slide-has-img"><div class="slide-text-block"><div class="news-eyebrow">' + (s.eyebrow||'') + '</div><div class="news-headline">' + hl + '</div>' + body + ' ' + chip + '</div><div class="slide-img-block"><img class="slide-bg-img" src="' + s.bgImage + '"></div></div>';
      }
      return '<div class="slide slide-news"><div class="slide-inner"><div class="news-eyebrow">' + (s.eyebrow||'') + '</div><div class="news-headline">' + hl + '</div>' + body + ' ' + chip + '</div></div>';
    }

    if (s.type === 'achievement') {
      const inner = '<span class="rings-float">\uD83C\uDFC5</span><div class="wof-tag">' + (s.tag||'Wall of Fame') + '</div><div class="athlete-name">' + (s.title||'') + '</div><div class="achievement-feat">' + (s.subtitle||'') + '</div><div class="sign-wall-btn">&#9889; Sign the Wall</div>';
      return withImgP('slide-achievement', inner);
    }
    if (s.type === 'record') {
      const recs = (s.records||[]).map(r => '<div class="record-card"><div class="record-obstacle">' + r.obstacle + '</div><div class="record-holder">' + r.holder + '</div><div class="record-time">' + r.time + '</div></div>').join('');
      const inner = '<div class="records-eyebrow">' + (s.eyebrow||'') + '</div><div class="records-title">' + (s.title||'') + '</div><div class="records-grid">' + recs + '</div>';
      return withImgP('slide-records', inner);
    }
    if (s.type === 'facebook') {
      const fbSrc = s.url ? 'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(s.url)+'&autoplay=1&mute=0&show_text=0&width=auto' : '';
      const fbDur = String((s.customDuration||30)*1000);
      return '<div class="slide slide-facebook" data-dur="'+fbDur+'">'
        +'<div class="fb-frame-wrap">'
        +'<iframe src="'+fbSrc+'" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>'
        +'</div>'
        +(s.label?'<div class="slide-fb-label">'+esc(s.label)+'</div>':'')
        +'</div>';
    }

    if (s.type === 'highlight') {
      const photo = s.photo ? '<img src="' + s.photo + '" style="width:100%;height:100%;object-fit:cover;object-position:top center;">' : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a1a2e;font-size:8rem;">&#129399;</div>';

var liveSha = null;
function liveRepo() { return (document.getElementById('ghRepo').value.trim()) || 'mastercosmo/tcn-display'; }
function liveTok()  { return document.getElementById('ghToken').value.trim(); }
async function fetchLiveSha() {
  const r = await fetch('https://api.github.com/repos/' + liveRepo() + '/contents/data.json?t=' + Date.now(), { headers: { 'Authorization': 'Bearer ' + liveTok(), 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
  if (r.status === 404) return 'none';
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return (await r.json()).sha;
}
function applyLiveData(d) {
  slides = (d.slides || []).map(function(s){ if (!s.id) s.id = uid(); return s; });
  events = d.events || []; bannerAds = d.bannerAds || [];
  const st = d.settings || {};
  document.getElementById('sDuration').value = Math.round((st.duration || 9000) / 1000);
  document.getElementById('sLocation').value = st.location || '';
  document.getElementById('sTicker').value = (st.tickerItems || []).join('\n');
  const hm = document.getElementById('sHeaderMsg');
  if (hm) { hm.value = st.headerMsg || ''; updateHeaderMsg(hm.value); localStorage.setItem('tcn_header_msg', hm.value); }
  activeId = slides.length ? slides[0].id : null;
  renderList();
  if (activeId) selectSlide(activeId);
  else { document.getElementById('emptyState').style.display = 'flex'; document.getElementById('editorContent').style.display = 'none'; }
}
async function loadFromLive(silent) {
  if (!liveTok()) { if (!silent) toast('Enter your GitHub token under Publish to Web first', 'var(--red)'); return false; }
  if (!silent && !confirm('Replace everything in this editor with the live published display?')) return false;
  try {
    const r = await fetch('https://api.github.com/repos/' + liveRepo() + '/contents/data.json?t=' + Date.now(), { headers: { 'Authorization': 'Bearer ' + liveTok(), 'Accept': 'application/vnd.github.raw+json' }, cache: 'no-store' });
    if (!r.ok) throw new Error('GitHub ' + r.status);
    const d = JSON.parse(await r.text());
    liveSha = await fetchLiveSha();
    applyLiveData(d);
    toast('Loaded live display (' + slides.length + ' slides)');
    return true;
  } catch(e) { toast('Load failed: ' + e.message, 'var(--red)'); return false; }
}

    else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}

async function getSha(){
  var r = await fetch(api('data.json') + '?t=' + Date.now(), {headers: ghHeaders({'Accept':'application/vnd.github+json'}), cache:'no-store'});
  if (r.status === 404) return 'none';
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return (await r.json()).sha;
}
async function upsert(path, content, message){
  var url = api(path);
  var bytes = new TextEncoder().encode(content), bin = '';
  for (var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  var b64 = btoa(bin);
  for (var attempt = 0; attempt < 2; attempt++){
    var sha = null;
    var c = await fetch(url + '?t=' + Date.now(), {headers: ghHeaders({'Accept':'application/vnd.github+json'}), cache:'no-store'});
    if (c.ok){ sha = (await c.json()).sha; }
    var body = {message: message, content: b64}; if (sha) body.sha = sha;
    var r = await fetch(url, {method:'PUT', headers: ghHeaders({'Accept':'application/vnd.github+json','Content-Type':'application/json'}), body: JSON.stringify(body)});
    if (r.ok){ try { return (await r.json()).content.sha; } catch(x){ return null; } }
    if (r.status === 409 && attempt === 0) continue; // stale sha, retry once
    var e = {}; try { e = await r.json(); } catch(x){}
    throw new Error((e.message || ('HTTP ' + r.status)) + ' (' + path + ')');
  }
}

async function publish(){
  if (!loaded || publishing) return;
  if (!slides.length){ var ok = await confirmSheet('Publish with no slides?', 'The TV display will have nothing to show.', 'Publish anyway'); if (!ok) return; }
  try {
    var cur = await getSha();
    if (cur !== 'none' && cur !== liveSha){
      var go = await confirmSheet('Live display changed', 'It was updated (probably from your computer) after you loaded it here. Publishing now will overwrite those changes.', 'Publish anyway');
      if (!go) return;
    }
  } catch(e){ /* check failed: continue */ }
  publishing = true; updatePub();
  var b = $('#btnPub'); var old = b.firstChild.textContent; b.firstChild.textContent = 'Publishing…';
  try {
    var payload = {slides: slides, events: events, bannerAds: bannerAds, settings: settings};
    var html = buildDisplayForPublish(payload, atob(DISPLAY_CSS_B64), 'data:image/png;base64,' + LOGO_B64);
    await upsert('index.html', html, 'Update TCN display (mobile)');
    liveSha = await upsert('data.json', JSON.stringify(payload, null, 2), 'Update display data (mobile)');
    dirty = false;
    toast('Published! Live in ~1 min', 'ok');
  } catch(e){
    toast('Publish failed: ' + e.message, 'err');
  }
  publishing = false; b.firstChild.textContent = old; updatePub();
}

// ───────────────────────── images ─────────────────────────
function shrinkImage(file, maxDim){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('Could not read image')); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ rej(new Error('Not a valid image')); };
      img.onload = function(){
        var s = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * s), hh = Math.round(img.height * s);
        var cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        var ctx = cv.getContext('2d');
        var png = file.type === 'image/png';
        if (!png){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hh); }
        ctx.drawImage(img, 0, 0, w, hh);
        res(png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// ───────────────────────── field builders ─────────────────────────
function textField(obj, key, label, o){
  o = o || {};
  var val = obj[key] != null ? obj[key] : (o.def || '');
  var el = o.area ? h('textarea', {class:'fi', rows:o.rows || 3, placeholder:o.ph || ''}) : h('input', {class:'fi', type:o.type || 'text', placeholder:o.ph || '', inputmode:o.inputmode});
  if (o.max) el.setAttribute('maxlength', o.max);
  el.value = val;
  var cnt = o.max ? h('span', {class:'cnt', text: String(val.length) + ' / ' + o.max}) : null;
  el.addEventListener('input', function(){
    obj[key] = o.num ? +el.value : el.value;
    if (cnt) cnt.textContent = el.value.length + ' / ' + o.max;
    markDirty();
    if (o.onchange) o.onchange();
  });
  return h('div', {class:'fg'}, h('label', {class:'fl'}, label, cnt), el, o.hint ? h('p', {class:'fh', text:o.hint}) : null);
}
function checkField(obj, key, label, after){
  var cb = h('input', {type:'checkbox'}); cb.checked = !!obj[key];
  cb.addEventListener('change', function(){ obj[key] = cb.checked; markDirty(); if (after) after(); });
  return h('label', {class:'chk'}, cb, label);
}
function imageField(s, key, label, hint, maxDim){
  var box = h('div', {class:'img-box'});
  var file = h('input', {type:'file', accept:'image/*'});
  file.addEventListener('change', async function(){
    var f = file.files[0]; if (!f) return;
    try { s[key] = await shrinkImage(f, maxDim || 1280); markDirty(); openEditor(s.id, true); toast('Image added', 'ok'); }
    catch(e){ toast(e.message, 'err'); }
  });
  if (s[key]){
    box.appendChild(h('img', {src:s[key], alt:''}));
    box.appendChild(h('div', {class:'row'},
      h('button', {class:'btn btn-ghost', text:'Replace', onclick:function(){ file.click(); }}),
      h('button', {class:'btn btn-danger', text:'Remove', onclick:function(){ s[key] = ''; markDirty(); openEditor(s.id, true); }})));
  } else {
    box.appendChild(h('button', {class:'btn btn-ghost btn-block', text:'📷  Choose photo / image', onclick:function(){ file.click(); }}));
  }
  box.appendChild(file);
  return h('div', {class:'fg'}, h('label', {class:'fl', text:label}), box, hint ? h('p', {class:'fh', text:hint}) : null);
}

// ───────────────────────── slides ─────────────────────────
var TYPES = {
  news:        {label:'News',        emoji:'📣', name:'News Slide'},
  achievement: {label:'Achievement', emoji:'🏆', name:'Achievement / Wall of Fame'},
  record:      {label:'Records',     emoji:'⏱',  name:'Records Board'},
  ad:          {label:'Ad / Sponsor',emoji:'💼', name:'Ad / Sponsor Slide'},
  highlight:   {label:'Ninja Highlight', emoji:'⭐', name:'Ninja Highlight'},
  youtube:     {label:'YouTube / Live', emoji:'📺', name:'YouTube / Live Stream'},
  facebook:    {label:'Facebook Video', emoji:'📘', name:'Facebook Video / Live'}
};
var DEFAULTS = {
  news:        function(){ return {type:'news',eyebrow:'Gym Update',headline:'SLIDE\nHEADLINE',accentWord:'HEADLINE',body:'Enter your message here.',chip:'Date or detail here'}; },
  achievement: function(){ return {type:'achievement',tag:'Wall of Fame',title:'Athlete Name',subtitle:'Achievement description here',cta:'Sign the Wall'}; },
  record:      function(){ return {type:'record',eyebrow:'⏱ Gym Records',title:'Course Records',records:[{obstacle:'Obstacle',holder:'Name',time:':00.0'}]}; },
  ad:          function(){ return {type:'ad',tag:'Community Partner',businessName:'Business Name',message:'Your message to TCN families',cta:'Mention TCN for a special offer',logoImage:''}; },
  highlight:   function(){ return {type:'highlight',name:'Ninja Name',age:'',obstacle:'',quote:'',photo:''}; },
  youtube:     function(){ return {type:'youtube',label:'Now Playing',videoId:'',autoplay:true,mute:true,showLabel:true,isLive:false}; },
  facebook:    function(){ return {type:'facebook',url:'',label:'',customDuration:30}; }
};
function slideTitle(s){
  return s.businessName || s.title || (s.headline || '').split('\n')[0] || s.name || s.label || s.videoId || s.url || 'Untitled';
}
function slideSub(s){
  return s.subtitle || s.body || s.message || s.quote || s.chip || s.eyebrow || '';
}
function idx(id){ for (var i = 0; i < slides.length; i++) if (slides[i].id === id) return i; return -1; }

function renderSlides(){
  var v = $('#v-slides'); v.innerHTML = '';
  v.appendChild(h('div', {class:'sect', text: slides.length + ' slide' + (slides.length === 1 ? '' : 's') + ' · plays top to bottom'}));
  slides.forEach(function(s, i){
    var t = TYPES[s.type] || {label:s.type};
    v.appendChild(h('div', {class:'card slide-row'},
      h('div', {class:'main', onclick:function(){ openEditor(s.id); }},
        h('span', {class:'badge', text:t.label}),
        h('div', {class:'t', text:slideTitle(s)}),
        h('div', {class:'s', text:slideSub(s).replace(/\n/g, ' ')})),
      h('div', {class:'acts'},
        h('button', {class:'ib', 'aria-label':'Move up', disabled:i === 0, text:'↑', onclick:function(){ moveSlide(s.id, -1); }}),
        h('button', {class:'ib', 'aria-label':'Move down', disabled:i === slides.length - 1, text:'↓', onclick:function(){ moveSlide(s.id, 1); }}),
        h('button', {class:'ib del', 'aria-label':'Delete', text:'🗑', onclick:function(){ askDeleteSlide(s.id); }}))));
  });
  v.appendChild(h('div', {class:'addbar'}, h('button', {class:'btn btn-pub btn-block', text:'＋  Add slide', onclick:function(){ $('#mAdd').classList.add('on'); }})));
}
function moveSlide(id, d){
  var i = idx(id), j = i + d; if (i < 0 || j < 0 || j >= slides.length) return;
  var t = slides[i]; slides[i] = slides[j]; slides[j] = t; markDirty(); renderSlides();
}
async function askDeleteSlide(id){
  var s = slides[idx(id)]; if (!s) return;
  if (await confirmSheet('Delete this slide?', '“' + slideTitle(s) + '” will be removed (publish to update the TV).')){
    slides.splice(idx(id), 1); markDirty(); closeEditor(); renderSlides(); toast('Slide deleted');
  }
}
function addSlide(type){
  var s = DEFAULTS[type](); s.id = uid(); slides.push(s); markDirty();
  $('#mAdd').classList.remove('on'); renderSlides(); openEditor(s.id);
}

function openEditor(id, keepScroll){
  var s = slides[idx(id)]; if (!s) return;
  openId = id;
  var body = $('#edBody'), sc = body.scrollTop;
  body.innerHTML = '';
  var t = TYPES[s.type] || {name:'Slide'};
  $('#edTitle').firstChild.textContent = t.name;
  $('#edSub').textContent = s.type;
  buildFields(s, body);
  $('#editor').classList.add('on');
  body.scrollTop = keepScroll ? sc : 0;
}
function closeEditor(){ $('#editor').classList.remove('on'); openId = null; renderSlides(); }

function buildFields(s, b){
  var add = function(x){ b.appendChild(x); };
  if (s.type === 'news'){
    add(textField(s, 'eyebrow', 'Eyebrow label', {hint:'Small text above the headline'}));
    add(textField(s, 'headline', 'Headline (new line = line break)', {area:true, rows:3}));
    add(textField(s, 'accentWord', 'Accent word (shown in orange)', {ph:'Which word to highlight?'}));
    add(textField(s, 'body', 'Body text', {area:true}));
    add(textField(s, 'chip', 'Chip / date label', {ph:'e.g. May 17th · Sign Up at Front Desk'}));
    add(imageField(s, 'bgImage', 'QR code / image (optional)', 'Shown below the text on the slide'));
  } else if (s.type === 'achievement'){
    add(textField(s, 'tag', 'Tag line', {def:'Wall of Fame'}));
    add(textField(s, 'title', 'Athlete / person name', {ph:'e.g. Payton McNulty'}));
    add(textField(s, 'subtitle', 'Achievement description', {ph:'e.g. Completed the 14-Foot Warped Wall'}));
    add(textField(s, 'cta', 'Call-to-action button', {def:'Sign the Wall', hint:'Text in the orange button at the bottom'}));
    add(imageField(s, 'bgImage', 'Content image (optional)'));
  } else if (s.type === 'record'){
    add(textField(s, 'eyebrow', 'Eyebrow label', {def:'⏱ Gym Records'}));
    add(textField(s, 'title', 'Board title', {def:'Course Records'}));
    b.appendChild(h('div', {class:'sect', text:'Records'}));
    if (!s.records) s.records = [];
    s.records.forEach(function(r, i){
      var oi = h('input', {class:'fi', placeholder:'Obstacle'}); oi.value = r.obstacle || '';
      var hi = h('input', {class:'fi', placeholder:'Name'});     hi.value = r.holder || '';
      var ti = h('input', {class:'fi', placeholder:'Time'});     ti.value = r.time || '';
      oi.oninput = function(){ r.obstacle = oi.value; markDirty(); };
      hi.oninput = function(){ r.holder = hi.value; markDirty(); };
      ti.oninput = function(){ r.time = ti.value; markDirty(); };
      b.appendChild(h('div', {class:'rec'},
        h('div', {class:'top2'}, oi, h('button', {class:'ib del', text:'✕', 'aria-label':'Remove record', onclick:function(){ s.records.splice(i, 1); markDirty(); openEditor(s.id, true); }})),
        h('div', {class:'r2'}, hi, ti)));
    });
    add(h('button', {class:'btn btn-ghost btn-block', style:'margin-bottom:18px', text:'＋  Add record', onclick:function(){ s.records.push({obstacle:'', holder:'', time:''}); markDirty(); openEditor(s.id, true); }}));
    add(imageField(s, 'bgImage', 'Content image (optional)'));
  } else if (s.type === 'ad'){
    add(textField(s, 'tag', 'Badge label', {def:'Community Partner'}));
    add(textField(s, 'businessName', 'Business name', {ph:'e.g. Fenton Family Orthodontics'}));
    add(imageField(s, 'logoImage', 'Business logo', 'PNG with transparent background works best', 800));
    add(textField(s, 'message', 'Tagline / message', {area:true}));
    add(textField(s, 'cta', 'Call to action', {ph:'e.g. Mention TCN for 10% off'}));
    add(imageField(s, 'bgImage', 'Content image (optional)', 'Shown below the sponsor info'));
  } else if (s.type === 'highlight'){
    add(imageField(s, 'photo', 'Ninja photo', 'Portrait / vertical photo works best'));
    add(textField(s, 'name', 'Ninja name', {ph:'e.g. Zoey Balogh'}));
    add(textField(s, 'age', 'Age', {ph:'e.g. 12', inputmode:'numeric'}));
    add(textField(s, 'obstacle', 'Favorite obstacle', {ph:'e.g. Warped Wall'}));
    add(textField(s, 'quote', 'Quote / comment', {area:true, rows:4, hint:'Why do they love ninja? In their own words!'}));
    add(imageField(s, 'qrCode', 'Nomination QR code (optional)', 'PNG works best', 800));
  } else if (s.type === 'youtube'){
    add(textField(s, 'videoId', 'YouTube video ID or URL', {hint:'Paste the full URL or just the ID (after ?v=)'}));
    add(checkField(s, 'autoplay', 'Autoplay'));
    add(checkField(s, 'mute', 'Muted (required for autoplay)'));
    var opts = h('div', {class:'note', style:'display:' + (s.showLabel ? 'block' : 'none')});
    add(checkField(s, 'showLabel', 'Show badge overlay', function(){ opts.style.display = s.showLabel ? 'block' : 'none'; }));
    opts.appendChild(textField(s, 'label', 'Badge label', {def:'Now Playing'}));
    opts.appendChild(checkField(s, 'isLive', 'Show pulsing red LIVE dot'));
    add(opts);
  } else if (s.type === 'facebook'){
    add(textField(s, 'url', 'Facebook video URL', {ph:'https://www.facebook.com/video/...', type:'url'}));
    add(textField(s, 'label', 'Label (shown on TV)', {ph:'e.g. Coach Mike streaming live'}));
    add(textField(s, 'customDuration', 'Slide duration (seconds)', {type:'number', inputmode:'numeric', num:true, def:30, hint:'Overrides the global duration. Streams do best at 30–120s.'}));
  }
  add(h('button', {class:'btn btn-pub btn-block', style:'margin-top:8px', text:'Done', onclick:closeEditor}));
}

    dy.oninput = function(){ ev.day = dy.value; markDirty(); };

    ty.oninput = function(){ ev.type = ty.value; markDirty(); };

    grid.appendChild(h('button', {onclick:function(){ addSlide(k); }}, h('span', {class:'e', text:TYPES[k].emoji}), TYPES[k].label));
  });
  $('#mAddCancel').onclick = function(){ $('#mAdd').classList.remove('on'); };

  $('#edDel').onclick = function(){ if (openId) askDeleteSlide(openId); };
  $('#btnPub').onclick = publish;

});
